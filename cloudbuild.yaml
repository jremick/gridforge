# Google Cloud Build CI pipeline for GridForge / oss-mapper (cached PyQGIS 3.40 Docker build + offline tests)
# Manual run: gcloud builds submit --region=australia-southeast2 --config=cloudbuild.yaml .

substitutions:
  _REGION: australia-southeast2
  _AR_REPO: forge-ci

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build & inline-cache multi-stage GridForge image (Node 22 Vite SPA + Debian Trixie PyQGIS 3.40)
  - id: build-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -euxc
      - |
        CACHE_IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gridforge:cache"
        docker pull "$${CACHE_IMG}" || true
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$${CACHE_IMG}" \
          -t "gridforge:ci-${BUILD_ID}" \
          -t "$${CACHE_IMG}" \
          .

  # 2. Typecheck and build web SPA in parallel
  - id: test-web
    name: node:22-slim
    waitFor: ['-']
    dir: web
    entrypoint: sh
    args:
      - -euxc
      - |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npm run typecheck
        npm run build

  # 3. Run offline unit and headless PyQGIS integration tests inside the freshly built image
  - id: test-pyqgis
    name: "gridforge:ci-${BUILD_ID}"
    waitFor: ['build-image']
    entrypoint: bash
    args:
      - -euxc
      - |
        pytest -m "not live" -v

  # 4. Push updated Docker layer cache only after all tests pass
  - id: push-cache
    name: gcr.io/cloud-builders/docker
    waitFor: ['test-pyqgis', 'test-web']
    entrypoint: bash
    args:
      - -euxc
      - |
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gridforge:cache"
