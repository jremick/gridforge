# GDAL OSM driver configuration for GridForge
# Reference: https://gdal.org/en/stable/drivers/vector/osm.html
# Usage: OSM_CONFIG_FILE=config/osmconf.ini ogr2ogr -f GPKG osm.gpkg input.osm

# Global settings (must appear before section headers)
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,water,highway=platform,public_transport=platform
attribute_name_laundering=no

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
other_tags=yes
all_tags=no
attributes=name,highway,railway,aeroway,natural,ele,amenity,place,power,man_made,tourism
ignore=created_by,converted_by,source,time,ele:msl,note,openGeoDB:,fixme,FIXME
unsignificant=created_by,converted_by,source,time,note,openGeoDB:,fixme,FIXME

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
other_tags=yes
all_tags=no
attributes=name,highway,ref,surface,tracktype,railway,aeroway,waterway,intermittent,power,man_made,bridge,tunnel,layer,oneway
ignore=created_by,converted_by,source,time,note,openGeoDB:,fixme,FIXME

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
other_tags=yes
all_tags=no
attributes=name,type,highway,ref,waterway,railway,route
ignore=created_by,converted_by,source,time,note,openGeoDB:,fixme,FIXME

[multipolygons]
osm_id=yes
osm_way_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
other_tags=yes
all_tags=no
attributes=name,natural,landuse,leaf_type,water,waterway,building,amenity,leisure,aeroway,boundary
ignore=area,created_by,converted_by,source,time,note,openGeoDB:,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
other_tags=yes
all_tags=no
attributes=name,type,boundary,admin_level
ignore=created_by,converted_by,source,time,note,openGeoDB:,fixme,FIXME
