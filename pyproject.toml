[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridforge"
version = "1.6.1"
description = "Open-source military-style MGRS topographic map generator using headless PyQGIS"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "GridForge Contributors" },
]
keywords = ["gis", "topographic", "mgrs", "utm", "qgis", "cartography", "pdf", "wmm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyproj>=3.6",
    "mgrs>=1.6.0",
    "pygeomag==1.1.0",
    "shapely>=2.0",
    "httpx>=0.27",
    "pypdf>=7.0.1",
    "pillow>=13.0.0",
    "fastapi>=0.115.12",
    "starlette>=1.9",
    "uvicorn[standard]>=0.30",
    "h11>=0.16.0",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
gridforge = "gridforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests requiring live internet access to Overpass / Copernicus DEM",
]
