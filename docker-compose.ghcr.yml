# Zero-build 10-second self-hosted GridForge Print Studio stack using prebuilt
# multi-arch (linux/amd64 + linux/arm64) images from GitHub Container Registry.
#
# Quickstart:
#   mkdir -p packs
#   docker compose -f docker-compose.ghcr.yml up -d
#   open http://localhost:8080
#
# Optional air-gapped web basemap:
#   1. Place a raster MBTiles archive at ./basemap.mbtiles
#   2. Uncomment the basemap volume mount and GRIDFORGE_BASEMAP_MBTILES below
#   3. Restart: docker compose -f docker-compose.ghcr.yml up -d

services:
  web:
    image: ${GRIDFORGE_IMAGE:-ghcr.io/jremick/gridforge:latest}
    command: ["uvicorn", "gridforge.web.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${GRIDFORGE_PORT:-8080}:8080"
    environment:
      - GRIDFORGE_DATA_DIR=/data/jobs
      - GRIDFORGE_PACKS_DIR=/data/packs
      - GRIDFORGE_WEB_DIST=/app/web/dist
      - GRIDFORGE_ALLOWED_HOSTS=${GRIDFORGE_ALLOWED_HOSTS:-}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - GDAL_CACHEMAX=192
      - OMP_THREAD_LIMIT=1
      # Uncomment for air-gapped offline Studio basemap tiles:
      # - GRIDFORGE_BASEMAP_MBTILES=/data/basemap.mbtiles
    volumes:
      - gridforge-data:/data/jobs
      - ./packs:/data/packs
      # Uncomment for air-gapped offline Studio basemap tiles:
      # - ./basemap.mbtiles:/data/basemap.mbtiles:ro
    # Web server never imports qgis.core; stays lightweight (< 150 MB typical)
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: ${GRIDFORGE_IMAGE:-ghcr.io/jremick/gridforge:latest}
    command: ["python3", "-m", "gridforge.web.worker"]
    environment:
      - QT_QPA_PLATFORM=offscreen
      - GRIDFORGE_DATA_DIR=/data/jobs
      - GRIDFORGE_PACKS_DIR=/data/packs
      - GRIDFORGE_CACHE_DIR=/tmp/gridforge-cache
      - GRIDFORGE_WORKER_CONCURRENCY=1
      - GDAL_CACHEMAX=192
      - OMP_THREAD_LIMIT=1
      - OVERPASS_URL=${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
    volumes:
      - gridforge-data:/data/jobs
      - gridforge-cache:/tmp/gridforge-cache
      - ./packs:/data/packs:ro
    # Single-concurrency worker with strict memory guardrails for 16 GB hosts
    mem_limit: 3g
    memswap_limit: 3584m
    restart: unless-stopped

  cli:
    profiles: ["cli"]
    image: ${GRIDFORGE_IMAGE:-ghcr.io/jremick/gridforge:latest}
    volumes:
      - ./out:/out
      - ./packs:/data/packs
      - gridforge-cache:/tmp/gridforge-cache
    environment:
      - QT_QPA_PLATFORM=offscreen
      - GRIDFORGE_CACHE_DIR=/tmp/gridforge-cache
      - GRIDFORGE_PACKS_DIR=/data/packs
      - GDAL_CACHEMAX=192
      - OMP_THREAD_LIMIT=1
      - OVERPASS_URL=${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
    mem_limit: 3g
    command: ["gridforge", "--help"]

volumes:
  gridforge-data:
  gridforge-cache:
